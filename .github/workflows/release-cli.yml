name: release-cli

# Publishes the AegisRunner CLI + self-hosted runner image on a `cli-v*` tag:
#   git tag cli-v1.0.0 && git push origin cli-v1.0.0
#
# Required repo secrets:
#   NPM_TOKEN            — npm automation token (publishes @aegisrunner/cli)
#   DOCKERHUB_USERNAME   — Docker Hub user (aegisrunner1) with push to aegisrunner1/runner
#   DOCKERHUB_TOKEN      — Docker Hub access token
# GHCR uses the built-in GITHUB_TOKEN (no extra secret needed).

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write   # create the GitHub Release + attach the tarball
  packages: write   # push to GHCR

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack tarball
        run: npm pack
      - name: Attach tarball to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/*.tgz

  docker:
    name: Build & push runner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # cli-v1.0.0 -> :1.0.0 (+ :latest)
          images: |
            aegisrunner1/runner
            ghcr.io/aegis-runner/runner
          tags: |
            type=match,pattern=cli-v(.*),group=1
            type=raw,value=latest
      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: cli
          file: cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
