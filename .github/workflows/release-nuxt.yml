name: release-nuxt

# Publishes @aegisrunner/nuxt on a `nuxt-v*` tag:
#   git tag nuxt-v0.1.0 && git push origin nuxt-v0.1.0
#
# Reuses the same NPM_TOKEN repo secret as release-cli / release-vite.

on:
  push:
    tags: ['nuxt-v*']

permissions:
  contents: write

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack tarball
        run: npm pack
      - name: Attach tarball to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nuxt/*.tgz
